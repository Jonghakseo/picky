name: Agentd lint

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "10.15.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject new raw UI design values
        run: python3 scripts/lint-ui-design-tokens.py

      - name: Verify UI design token baseline provenance
        run: python3 scripts/lint-ui-design-tokens.py --verify-baseline

      - name: Reject unexpected ESLint suppressions
        run: pnpm run check:eslint-suppressions

      - name: Lint agentd with zero warnings
        run: pnpm --dir agentd run lint
