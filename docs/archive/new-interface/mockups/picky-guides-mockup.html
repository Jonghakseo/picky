<!doctype html>

<head>

  <title>Picky 가이드 및 업데이트 목업</title>
  <style>
    :root { --blue:#5284FF; --ink:#131419; --surface:#F9FAFF; --muted:#8D8D97; --border:#DCDFE6; --border-soft:#EAEBF0; --secondary:#404040; --tertiary:#595959; --white:#FFF; --radius:12px; --shadow:0 24px 64px rgba(25,27,38,.14),0 2px 8px rgba(25,27,38,.06); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#E9EDF3; color:var(--ink); font-family:"SF Pro Display","SF Pro Text","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    button, a { font:inherit; } a { color:inherit; text-decoration:none; }
    button:focus-visible, a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
    .preview-stage { width:100vw; height:100dvh; display:grid; place-items:center; overflow:hidden; contain:paint; padding:24px; }
    .app-window { width:1020px; height:720px; display:grid; grid-template-columns:190px minmax(0,1fr); overflow:hidden; border:1px solid rgba(212,210,221,.8); border-radius:18px; background:var(--white); box-shadow:var(--shadow); }
    .sidebar { display:flex; flex-direction:column; gap:35px; padding:21px 16px 18px; background:var(--surface); border-right:1px solid var(--border-soft); }
    .traffic-lights { display:flex; gap:7px; padding-left:2px; } .traffic-lights span { width:10px; height:10px; border-radius:50%; } .red { background:#FF5F57; } .yellow { background:#FEBC2E; } .green { background:#28C840; }
    .brand { display:inline-flex; align-items:center; width:144px; } .brand-logo { display:block; width:100%; height:auto; }
    .nav-list { display:grid; gap:4px; margin:0; padding:0; list-style:none; }
    .nav-link { display:flex; align-items:center; gap:10px; min-height:40px; padding:8px 10px; border-radius:9px; color:var(--secondary); font-size:14px; font-weight:600; }
    .nav-link svg { width:18px; height:18px; stroke-width:2; } .nav-link.active { color:var(--ink); background:#f1f2fb; } .nav-link:hover { background:#f1f2fb; } .nav-link:active { background:#f1f2fb; }
    .main-panel { min-height:0; overflow-y:auto; background:var(--white); -ms-overflow-style:none; scrollbar-width:none; } .main-panel::-webkit-scrollbar { width:0; height:0; }
    .main-content { width:780px; margin:0 auto; padding:32px 30px 60px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; } h1 { margin:0; font-size:28px; line-height:1.2; letter-spacing:-1.4px; font-weight:700; text-wrap:balance; } .page-head p { margin:7px 0 0; color:var(--secondary); font-size:14px; line-height:1.45; text-wrap:pretty; }
    .feed { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:28px; }
    .video-card { display:flex; flex-direction:column; overflow:hidden; padding:0; border:0; background:var(--white); color:var(--ink); text-align:left; cursor:pointer; }
    .video-card:hover { box-shadow:0 5px 14px rgba(25,27,38,.07); }
    .video-card:hover .video-body { border-color:#AFC7FF; }
    .video-card:active { transform:translateY(1px); }
    .video-thumb { display:block; width:100%; aspect-ratio:16/9; border-radius:var(--radius) var(--radius) 0 0; background:var(--muted); }
    .video-body { display:block; flex:1; padding:14px 15px 15px; border:1px solid var(--border); border-top:0; border-radius:0 0 var(--radius) var(--radius); } .video-meta { display:flex; gap:7px; align-items:center; margin:0; color:var(--tertiary); font-size:12px; font-weight:600; line-height:1.3; } .video-meta span + span::before { margin-right:7px; color:var(--border); content:"·"; }
    .video-title { display:block; margin:8px 0 0; font-size:16px; line-height:1.35; letter-spacing:-.5px; font-weight:700; text-wrap:balance; } .video-description { display:block; margin:5px 0 0; color:var(--secondary); font-size:13px; line-height:1.45; text-wrap:pretty; }
    dialog { width:min(640px,calc(100vw - 48px)); max-width:none; padding:0; overflow:hidden; border:1px solid var(--border); border-radius:16px; background:var(--white); color:var(--ink); box-shadow:0 24px 64px rgba(19,20,25,.28); }
    dialog::backdrop { background:rgba(19,20,25,.52); } .dialog-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:20px 20px 16px; } .dialog-head h2 { margin:7px 0 0; font-size:19px; line-height:1.35; letter-spacing:-.6px; font-weight:700; text-wrap:balance; } .dialog-meta { margin:0; color:var(--tertiary); font-size:12px; font-weight:600; }
    .close-button { display:grid; flex:none; place-items:center; width:32px; height:32px; padding:0; border:1px solid var(--border); border-radius:50%; background:var(--white); color:var(--secondary); cursor:pointer; } .close-button:hover { border-color:var(--blue); color:var(--blue); } .close-button::before, .close-button::after { position:absolute; width:13px; height:1.5px; background:currentColor; content:""; } .close-button::before { transform:rotate(45deg); } .close-button::after { transform:rotate(-45deg); }
    .player-wrap { aspect-ratio:16/9; background:var(--ink); } iframe { display:block; width:100%; height:100%; border:0; }
    @media (max-width:850px) { .preview-stage { place-items:start center; padding:16px; } .app-window { width:100%; min-width:0; } .sidebar { padding-right:10px; padding-left:10px; } .nav-link { justify-content:center; padding:8px; } .nav-link span, .brand-logo { display:none; } .brand { width:auto; justify-content:center; } .brand::after { width:24px; height:24px; border-radius:50%; background:var(--blue); content:""; } .app-window { grid-template-columns:64px minmax(0,1fr); } .main-content { width:100%; padding:28px 24px 52px; } }
    @media (max-width:650px) { .feed { grid-template-columns:1fr; } .page-head { display:block; } }
  </style>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    window.lucide?.createIcons({ attrs: { "stroke-width": 2 } });

    const dialog = document.querySelector('#video-dialog');
    const player = document.querySelector('#video-player');
    const closeButton = document.querySelector('#close-dialog');
    const dialogTitle = document.querySelector('#dialog-title');
    const dialogMeta = document.querySelector('#dialog-meta');
    let trigger = null;

    document.querySelectorAll('.video-card').forEach((card) => {
      card.addEventListener('click', () => {
        trigger = card;
        dialogTitle.textContent = card.dataset.title;
        dialogMeta.textContent = `${card.dataset.type} · ${card.dataset.date} · 예시 콘텐츠`;
        player.title = `${card.dataset.title} 예시 영상`;
        player.src = `https://www.youtube.com/embed/${card.dataset.videoId}?rel=0`;
        dialog.showModal();
        closeButton.focus();
      });
    });

    closeButton.addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => {
      player.removeAttribute('src');
      player.title = '';
      trigger?.focus();
    });
  </script>
