<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Picky 빠른 시작 목업</title>
  <style>
    :root { --blue:#5284FF; --blue-dark:#0054D1; --ink:#131419; --surface:#F9FAFF; --border:#DCDFE6; --border-soft:#EAEBF0; --secondary:#404040; --tertiary:#595959; --white:#fff; --radius:12px; --shadow:0 24px 64px rgba(25,27,38,.14),0 2px 8px rgba(25,27,38,.06); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#E9EDF3; color:var(--ink); font-family:"SF Pro Display","SF Pro Text","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased; }
    button,textarea,a { font:inherit; } a { color:inherit; text-decoration:none; }
    button { cursor:pointer; } button:focus-visible,textarea:focus-visible,a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
    .preview-stage { width:100vw; height:100dvh; display:grid; place-items:center; overflow:hidden; contain:paint; padding:24px; }
    .app-window { width:1020px; height:720px; display:grid; grid-template-columns:190px minmax(0,1fr); overflow:hidden; border:1px solid rgba(212,210,221,.8); border-radius:18px; background:var(--white); box-shadow:var(--shadow); }
    .sidebar { display:flex; flex-direction:column; gap:35px; padding:21px 16px 18px; background:var(--surface); border-right:1px solid var(--border-soft); }
    .traffic-lights { display:flex; gap:7px; padding-left:2px; } .traffic-lights span { width:10px; height:10px; border-radius:50%; } .red{background:#FF5F57}.yellow{background:#FEBC2E}.green{background:#28C840}
    .brand { display:inline-flex; align-items:center; width:144px; } .brand-logo { display:block; width:100%; height:auto; }
    .nav-list { display:grid; gap:4px; margin:0; padding:0; list-style:none; }
    .nav-link { display:flex; align-items:center; gap:10px; min-height:40px; padding:8px 10px; border-radius:9px; color:var(--secondary); font-size:14px; font-weight:600; }
    .nav-link svg { width:18px; height:18px; stroke-width:2; } .nav-link.active { color:var(--ink); background:#f1f2fb; } .nav-link:hover { background:#f1f2fb; } .nav-link:active { background:#f1f2fb; }
    .main-panel { min-height:0; overflow-y:auto; background:var(--white); -ms-overflow-style:none; scrollbar-width:none; } .main-panel::-webkit-scrollbar { width:0; height:0; }
    .main-content { width:780px; height:100%; min-height:100%; margin:0 auto; padding:32px 30px 24px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; } h1 { margin:0; font-size:28px; line-height:1.2; letter-spacing:-1.4px; font-weight:700; } .page-head p { margin:7px 0 0; color:var(--secondary); font-size:14px; line-height:1.45; }
    .badge { display:inline-flex; align-items:center; width:fit-content; padding:5px 8px; border:1px solid #C9D8FF; border-radius:999px; background:#F4F7FF; color:var(--blue); font-size:11px; font-weight:600; line-height:1; }
    .resume-card { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:24px; padding:15px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
    .resume-copy { display:grid; gap:3px; } .resume-kicker { color:var(--blue); font-size:12px; font-weight:700; } .resume-title { font-size:14px; font-weight:700; } .resume-meta { color:var(--tertiary); font-size:12px; }
    .section-title { margin:30px 0 12px; font-size:19px; line-height:1.3; letter-spacing:-.7px; font-weight:700; }
    .workflow-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .workflow-card { display:flex; flex-direction:column; min-height:184px; padding:18px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
    .workflow-icon { display:grid; place-items:center; width:34px; height:34px; border:1px solid #C9D8FF; border-radius:9px; background:#F4F7FF; color:var(--blue-dark); } .workflow-icon svg { width:18px; height:18px; }
    .workflow-card h2 { margin:16px 0 0; font-size:16px; line-height:1.3; letter-spacing:-.4px; font-weight:700; } .workflow-card p { margin:6px 0 17px; color:var(--secondary); font-size:13px; line-height:1.45; }
    .secondary-button,.primary-button,.back-button { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; border-radius:8px; font-size:13px; font-weight:650; }
    .secondary-button { width:fit-content; margin-top:auto; padding:7px 11px; border:1px solid var(--border); background:var(--white); color:var(--blue); } .secondary-button:hover { border-color:var(--blue); background:#F7F9FF; }
    .action-button { display:inline-flex; align-items:center; gap:5px; width:fit-content; margin-top:auto; padding:6px 11px; white-space:nowrap; border:1px solid var(--border); border-radius:999px; background:var(--white); color:var(--blue); font-size:13px; font-weight:700; }
    .action-button svg { width:12px; height:12px; fill:currentColor; stroke-width:0; }
    .action-button:hover { border-color:var(--blue); background:#F7F9FF; }
    .action-button:active { transform:translateY(1px); }
    .primary-button { padding:9px 13px; border:1px solid var(--blue); background:var(--blue); color:var(--white); } .primary-button:hover { background:var(--blue); }
    .view[hidden] { display:none; }
    #question-view { display:flex; flex-direction:column; min-height:100%; }
    .workflow-head { display:flex; align-items:center; gap:10px; min-height:32px; } .back-button { padding:0; border:0; background:none; color:var(--blue); } .back-button:hover { text-decoration:underline; } .workflow-head h1 { font-size:22px; } .workflow-head .badge { margin-left:auto; }
    .progress { margin:24px 0 10px; color:var(--tertiary); font-size:12px; font-weight:600; }
    .conversation { display:grid; gap:12px; }
    .bubble { width:fit-content; max-width:570px; padding:12px 14px; border-radius:12px; font-size:14px; line-height:1.5; }
    .bubble.picky { border:1px solid var(--border); background:var(--surface); color:var(--ink); border-bottom-left-radius:3px; } .bubble.user { justify-self:end; background:var(--blue); color:var(--white); border-bottom-right-radius:3px; }
    .answer-form { position:sticky; bottom:0; z-index:1; margin-top:auto; padding:13px 0 8px; border-top:1px solid var(--border-soft); background:var(--white); }
    .answer-composer { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; align-items:end; }
    .answer-field { display:grid; gap:6px; }
    textarea { display:block; width:100%; min-height:42px; max-height:110px; resize:vertical; padding:10px 11px; border:1px solid var(--border); border-radius:8px; background:var(--white); color:var(--ink); font-size:13px; line-height:1.4; }
    textarea::placeholder { color:#8D8D97; }
    .answer-composer .primary-button { min-height:42px; padding:9px 14px; font-weight:700; }
    .summary { display:grid; gap:10px; margin-top:8px; padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); } .summary h2 { margin:0; font-size:18px; letter-spacing:-.5px; font-weight:700; } .summary p { margin:0; color:var(--secondary); font-size:13px; line-height:1.45; } .summary-list { display:grid; gap:7px; margin:2px 0 4px; padding:0; list-style:none; } .summary-list li { display:grid; grid-template-columns:104px 1fr; gap:10px; font-size:13px; line-height:1.4; } .summary-list span { color:var(--tertiary); } .success-state { display:grid; place-items:center; min-height:330px; padding:40px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); text-align:center; } .success-icon { display:grid; place-items:center; width:46px; height:46px; margin:auto; border-radius:50%; background:#E9F8EF; color:#108D6F; } .success-icon svg { width:24px; } .success-state h2 { margin:15px 0 0; font-size:20px; font-weight:700; } .success-state p { margin:7px 0 18px; color:var(--secondary); font-size:13px; }
    .status { margin-top:12px; color:var(--tertiary); font-size:12px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:800px) { .preview-stage { padding:12px; } .app-window { width:100%; grid-template-columns:64px minmax(0,1fr); } .sidebar { align-items:center; padding:21px 9px 18px; } .brand { width:30px; overflow:hidden; } .nav-link { justify-content:center; padding:8px; } .nav-link span { display:none; } .main-content { width:100%; padding:28px 22px 48px; } }
    @media (max-width:590px) { .workflow-grid { grid-template-columns:1fr; } .page-head { align-items:flex-end; } .resume-card { align-items:flex-start; flex-direction:column; } .answer-composer { grid-template-columns:1fr; } .answer-composer .primary-button { width:100%; } }
  </style>
</head>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    window.lucide?.createIcons({ attrs: { "stroke-width": 2 } });
    const DRAFT_KEY = 'picky.quick-start.draft.v1';
    const workflows = {
      landing: { title:'랜딩 페이지 제작', icon:'panels-top-left', description:'제품이나 서비스를 소개하는 웹페이지를 준비합니다.', questions:[
        { key:'goal', label:'만들려는 페이지의 목적을 적어주세요.', placeholder:'예: 예약을 늘리고 싶어요' },
        { key:'focus', label:(answers) => /판매|예약/.test(answers.goal || '') ? '소개할 상품 또는 서비스를 적어주세요.' : '가장 먼저 전할 핵심 메시지를 적어주세요.', placeholder:'예: 온라인 포트폴리오 상담' },
        { key:'audience', label:'주요 방문자는 누구인가요?', placeholder:'예: 처음 상담을 찾는 1인 사업자' }
      ] },
      native: { title:'네이티브 앱 제작', icon:'monitor-smartphone', description:'로컬에서 실행할 앱의 기본 범위를 정합니다.', questions:[
        { key:'purpose', label:'앱으로 해결하려는 일을 적어주세요.', placeholder:'예: 매일 할 일을 빠르게 정리' },
        { key:'users', label:(answers) => /팀|직원|동료/.test(answers.purpose || '') ? '이 앱을 함께 쓸 팀은 누구인가요?' : '이 앱을 가장 자주 쓸 사람은 누구인가요?', placeholder:'예: 혼자 일하는 디자이너' },
        { key:'mustHave', label:'처음 버전에 꼭 필요한 기능 하나를 적어주세요.', placeholder:'예: 오늘 할 일 추가와 완료 표시' }
      ] },
      guide: { title:'앱 가이드 시작', icon:'book-open-check', description:'현재 쓰는 앱을 목적에 맞춰 익혀봅니다.', questions:[
        { key:'app', label:'어떤 앱의 가이드가 필요한가요?', placeholder:'예: Notion' },
        { key:'task', label:(answers) => /Notion/i.test(answers.app || '') ? 'Notion에서 처음 해보고 싶은 일을 적어주세요.' : '그 앱에서 해보고 싶은 일을 적어주세요.', placeholder:'예: 프로젝트 보드를 만들고 싶어요' },
        { key:'level', label:'지금 사용 경험은 어느 정도인가요?', placeholder:'예: 처음이에요 / 기본 기능은 써봤어요' }
      ] },
      files: { title:'파일 정리 시작', icon:'folder-cog', description:'로컬 폴더를 원하는 기준으로 정리합니다.', questions:[
        { key:'location', label:'정리할 폴더 또는 파일 종류를 적어주세요.', placeholder:'예: 다운로드 폴더의 이미지 파일' },
        { key:'rule', label:(answers) => /사진|이미지/.test(answers.location || '') ? '사진·이미지를 어떤 기준으로 나눌까요?' : '파일을 어떤 기준으로 나눌까요?', placeholder:'예: 연도와 프로젝트 이름별' },
        { key:'keep', label:'정리할 때 꼭 남겨야 할 기준이 있나요?', placeholder:'예: 최근 3개월 파일은 그대로 두기' }
      ] }
    };
    const selectionView = document.getElementById('selection-view'); const questionView = document.getElementById('question-view'); const successView = document.getElementById('success-view');
    const grid = document.getElementById('workflow-grid'); const conversation = document.getElementById('conversation'); const form = document.getElementById('answer-form'); const input = document.getElementById('answer-input'); const summary = document.getElementById('summary'); const status = document.getElementById('status'); const quickStartStatus = document.getElementById('quick-start-status');
    let activeDraft = null;
    const formatDate = (value) => new Intl.DateTimeFormat('ko-KR',{ month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }).format(new Date(value));
    const readDraft = () => { try { const draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); return draft && workflows[draft.workflowId] ? draft : null; } catch { return null; } };
    const saveDraft = () => { activeDraft.updatedAt = new Date().toISOString(); localStorage.setItem(DRAFT_KEY, JSON.stringify(activeDraft)); };
    const show = (view) => { [selectionView,questionView,successView].forEach((item) => item.hidden = item !== view); };
    const renderGrid = () => { grid.innerHTML = Object.entries(workflows).map(([id, workflow]) => `<article class="workflow-card"><div class="workflow-icon"><i data-lucide="${workflow.icon}" aria-hidden="true"></i></div><h2>${workflow.title}</h2><p>${workflow.description}</p><button class="action-button" type="button" data-workflow="${id}" aria-label="${workflow.title} 시작하기"><i data-lucide="play" aria-hidden="true"></i>시작하기</button></article>`).join(''); window.lucide?.createIcons({ attrs:{ "stroke-width":2 } }); };
    const renderResume = () => { const draft = readDraft(); const card = document.getElementById('resume-card'); card.hidden = !draft; if (!draft) return; document.getElementById('resume-title').textContent = workflows[draft.workflowId].title; document.getElementById('resume-meta').textContent = `마지막 저장 ${formatDate(draft.updatedAt)}`; document.getElementById('resume-button').dataset.workflow = draft.workflowId; };
    const showSelection = () => { activeDraft = null; show(selectionView); renderResume(); document.querySelector('[data-workflow]')?.focus(); };
    const startWorkflow = (workflowId, resume = false) => { const saved = resume ? readDraft() : null; activeDraft = saved && saved.workflowId === workflowId ? saved : { workflowId, answers:{}, step:0, updatedAt:new Date().toISOString() }; show(questionView); renderQuestion(); };
    const createElement = (tagName, className, text) => { const element = document.createElement(tagName); if (className) element.className = className; if (text !== undefined) element.textContent = text; return element; };
    const appendBubble = (type, text) => conversation.append(createElement('div', `bubble ${type}`, text));
    const renderQuestion = () => { const workflow = workflows[activeDraft.workflowId]; const done = activeDraft.step >= workflow.questions.length; document.getElementById('workflow-title').textContent = workflow.title; conversation.replaceChildren(); Object.entries(activeDraft.answers).forEach(([key, value]) => { const question = workflow.questions.find((item) => item.key === key); const questionText = typeof question.label === 'function' ? question.label(activeDraft.answers) : question.label; appendBubble('picky', questionText); appendBubble('user', value); }); summary.hidden = !done; form.hidden = done; status.hidden = !done;
      if (done) { document.getElementById('progress').textContent = '3 / 3 질문'; summary.replaceChildren(); summary.append(createElement('h2', '', '준비가 됐어요'), createElement('p', '', '입력한 내용을 바탕으로 새 Pickle을 시작할 수 있어요.')); const list = createElement('ul', 'summary-list'); workflow.questions.forEach((question) => { const questionText = typeof question.label === 'function' ? question.label(activeDraft.answers) : question.label; const item = document.createElement('li'); item.append(createElement('span', '', questionText), createElement('strong', '', activeDraft.answers[question.key])); list.append(item); }); const startButton = createElement('button', 'primary-button', 'Pickle 시작'); startButton.id = 'start-pickle-button'; startButton.type = 'button'; summary.append(list, startButton); status.textContent = '질문을 모두 받았습니다.'; startButton.focus(); return; }
      const question = workflow.questions[activeDraft.step]; const questionText = typeof question.label === 'function' ? question.label(activeDraft.answers) : question.label; document.getElementById('progress').textContent = `${activeDraft.step + 1} / ${workflow.questions.length} 질문`; appendBubble('picky', questionText); input.value = ''; input.placeholder = question.placeholder; status.textContent = ''; input.focus(); };
    grid.addEventListener('click', (event) => { const button = event.target.closest('.action-button[data-workflow]'); if (!button) return; const workflowId = button.dataset.workflow; window.dispatchEvent(new CustomEvent('picky:start-quick-workflow', { detail: workflowId })); quickStartStatus.textContent = `${workflows[workflowId].title} 워크플로우를 시작했어요.`; });
    document.getElementById('resume-button').addEventListener('click', (event) => startWorkflow(event.currentTarget.dataset.workflow, true)); document.getElementById('back-button').addEventListener('click', showSelection);
    form.addEventListener('submit', (event) => { event.preventDefault(); const answer = input.value.trim(); if (!answer) { input.focus(); return; } const workflow = workflows[activeDraft.workflowId]; activeDraft.answers[workflow.questions[activeDraft.step].key] = answer; activeDraft.step += 1; saveDraft(); renderQuestion(); });
    input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
    summary.addEventListener('click', (event) => { if (!event.target.closest('#start-pickle-button')) return; localStorage.removeItem(DRAFT_KEY); activeDraft = null; show(successView); document.getElementById('new-workflow-button').focus(); }); document.getElementById('new-workflow-button').addEventListener('click', showSelection);
    renderGrid(); renderResume();
  </script>
</body>
