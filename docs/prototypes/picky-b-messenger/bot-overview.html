<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="bot-panel.css">
<title>피클 관리</title>
</head>
<body>
<main class="panel" aria-labelledby="panel-title">
  <header class="panel-header">
    <span id="avatar" class="avatar avatar-primary" aria-hidden="true">P</span>
    <div class="title-block"><h1 id="panel-title" data-panel-heading tabindex="-1">Picky</h1><p id="profile-label" class="subtle" hidden></p></div>
    <button id="settings" class="icon-button" type="button" aria-label="피클 설정" title="피클 설정"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.5 2.5-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-3.54v-.09A1.7 1.7 0 0 0 9.76 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06-2.5-2.5.06-.06A1.7 1.7 0 0 0 5.72 15a1.7 1.7 0 0 0-1.56-1.03H4.1v-3.54h.06A1.7 1.7 0 0 0 5.72 9.4a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.5-2.5.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V3.7h3.54v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.5 2.5-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.09v3.54h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
    <button id="close" class="icon-button" type="button" aria-label="피클 관리 닫기" title="피클 관리 닫기">×</button>
  </header>
  <div class="panel-body">
    <section class="panel-section" aria-labelledby="computer-heading">
      <div class="section-heading"><h2 id="computer-heading">컴퓨터</h2></div>
      <div class="computer-placeholder">
        <div class="computer-display" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></div>
        <p class="status-line"><span class="status-dot"></span><span id="computer-status">설정 필요 · 로컬 Linux 컴퓨터</span></p>
        <button id="computer" type="button">컴퓨터 환경</button>
      </div>
    </section>
    <section class="panel-section" aria-labelledby="routines-heading">
      <div class="section-heading"><h2 id="routines-heading">루틴</h2><button id="routine-new" type="button">루틴 추가</button></div>
      <div id="routine-list" class="routine-list"></div>
      <p id="empty-state" class="empty-state" hidden>아직 만든 루틴이 없어요.</p>
    </section>
    <p id="panel-error" class="error" role="alert" aria-live="polite"></p>
  </div>
  <div id="preview-banner" class="preview-banner" hidden>B.06 목업 · 실제 실행 없음 · <a href="index.html">메신저로 돌아가기</a></div>
</main>
<script src="bot-panel-bridge.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const providerName = { 'isolated-linux': '로컬 Linux 컴퓨터', browser: '분리된 브라우저', 'host-mac': '내 Mac' };
const days = ['일', '월', '화', '수', '목', '금', '토'];
function triggerSummary(triggers) {
  if (!triggers.length) return '실행 시기 필요';
  const trigger = triggers[0];
  const suffix = triggers.length > 1 ? ` 외 ${triggers.length - 1}개` : '';
  if (trigger.kind === 'weekly') return `매주 ${days[trigger.weekday]}요일 ${trigger.time}${suffix}`;
  if (trigger.kind === 'daily') return `매일 ${trigger.time}${suffix}`;
  return 'PR 병합 때' + suffix;
}
function routineStatus(routine) {
  if (!routine.enabled) return '일시정지';
  if (routine.triggers.some(trigger => trigger.kind === 'event')) return '연결 필요';
  return '예정';
}
function render(data) {
  document.documentElement.dataset.theme = new URLSearchParams(location.hash.slice(1)).get('theme') === 'dark' ? 'dark' : 'light';
  $('avatar').textContent = data.profile.name.slice(0, 1);
  $('avatar').classList.toggle('avatar-primary', data.botId === 'picky');
  $('panel-title').textContent = data.profile.name;
  $('profile-label').textContent = data.profile.label;
  $('profile-label').hidden = !data.profile.label;
  $('computer-status').textContent = `설정 필요 · ${providerName[data.computer.provider]}`;
  const list = $('routine-list');
  list.replaceChildren();
  $('empty-state').hidden = data.routines.length > 0;
  for (const routine of data.routines) {
    const item = document.createElement('div'); item.className = 'routine-item';
    const row = document.createElement('button');
    row.type = 'button'; row.className = 'routine-row'; row.dataset.id = routine.id; row.dataset.action = 'routine.open';
    row.setAttribute('aria-label', routine.name + ' 편집');
    const copy = document.createElement('span'); copy.className = 'routine-copy';
    const name = document.createElement('strong'); name.textContent = routine.name || '이름 없는 루틴';
    const detail = document.createElement('span'); detail.className = 'subtle'; detail.textContent = triggerSummary(routine.triggers);
    copy.append(name, detail);
    const status = document.createElement('span'); status.className = 'routine-status'; status.textContent = routineStatus(routine);
    row.append(copy, status);
    const history = document.createElement('button'); history.type = 'button'; history.className = 'routine-history-link';
    history.dataset.id = routine.id; history.dataset.action = 'routine.history'; history.textContent = '히스토리';
    history.setAttribute('aria-label', routine.name + ' 히스토리'); history.title = `실행 기록 ${routine.history.length}개`;
    item.append(row, history); list.append(item);
  }
}
BotPanel.register(render);
$('settings').addEventListener('click', () => BotPanel.action('settings'));
$('computer').addEventListener('click', () => BotPanel.action('computer'));
$('close').addEventListener('click', () => BotPanel.action('close'));
$('routine-new').addEventListener('click', () => BotPanel.action('routine.new'));
$('routine-list').addEventListener('click', event => { const row = event.target.closest('[data-id]'); if (row) BotPanel.action(row.dataset.action, { id: row.dataset.id }); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !event.isComposing) { event.preventDefault(); BotPanel.action('close'); } });
BotPanel.preview({ type: 'bot-panel.init', token: 'preview-overview', botId: 'picky', view: 'home', profile: { name: 'Picky', label: '조율', description: '', notifications: true }, computer: { provider: 'isolated-linux' }, routines: [{ id: 'weekday-check', name: '예약 화면 확인', prompt: '예약 날짜 흐름을 확인해요.', enabled: true, triggers: [{ kind: 'weekly', weekday: 1, time: '09:00', timezone: 'Asia/Seoul', repository: '' }], history: [] }], routine: null, draft: null });
if (window.parent === window) $('preview-banner').hidden = false;
</script>
</body>
</html>
