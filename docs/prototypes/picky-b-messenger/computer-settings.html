<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="bot-panel.css">
<title>컴퓨터 환경</title>
</head>
<body>
<main class="panel" aria-labelledby="panel-title">
  <header class="panel-header">
    <button id="back" class="back-button" type="button" aria-label="관리로 돌아가기">‹ 관리로 돌아가기</button>
    <div class="title-block"><h1 id="panel-title" data-panel-heading tabindex="-1">컴퓨터 환경</h1></div>
    <button id="close" class="icon-button" type="button" aria-label="피클 관리 닫기" title="피클 관리 닫기">×</button>
  </header>
  <form id="computer-form" class="panel-body">
    <section class="panel-section" aria-labelledby="provider-heading">
      <div class="section-heading"><h2 id="provider-heading">환경 선택</h2></div>
      <div class="mode-options">
        <label class="mode-option"><input type="radio" name="provider" value="isolated-linux"><span><strong>로컬 Linux 컴퓨터</strong><span>권장 조사 경로 · 설정 필요</span></span></label>
        <label class="mode-option"><input type="radio" name="provider" value="browser"><span><strong>분리된 브라우저</strong><span>설정 필요</span></span></label>
        <label class="mode-option"><input type="radio" name="provider" value="host-mac"><span><strong>내 Mac</strong><span>사용 권한 필요</span></span></label>
      </div>
      <div id="mode-copy" class="mode-copy"></div>
      <p id="boundary-note" class="field-note"></p>
      <p><a href="../../picky-local-computer-design.md" target="_blank" rel="noopener">격리 설계 보기</a></p>
    </section>
    <p id="panel-error" class="error" role="alert" aria-live="polite"></p>
    <div class="footer-actions"><button id="discard" type="button">변경 취소</button><button class="primary" type="submit">환경 선택 저장</button></div>
  </form>
  <div id="preview-banner" class="preview-banner" hidden>B.04 목업 · 실제 실행 없음 · <a href="index.html">메신저로 돌아가기</a></div>
</main>
<script src="bot-panel-bridge.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const details = {
  'isolated-linux': {
    copy: 'Linux 데스크톱, 브라우저, CLI를 개인 데스크톱과 분리해 조사하는 방식이에요. Mac 앱은 실행할 수 없고, 공유 마운트·네트워크·호스트 도구는 별도 경계가 필요해요.',
    boundary: '설정 필요 · 공유 폴더 없음 · 계정 연결 없음'
  },
  browser: {
    copy: '전용 브라우저 프로필로 쿠키와 로그인을 나눌 수 있어요. 호스트 파일과 도구의 OS 권한을 격리하지는 않아요.',
    boundary: '설정 필요 · 공유 폴더 없음 · 계정 연결 없음'
  },
  'host-mac': {
    copy: '공유된 물리적 Mac 데스크톱을 제어하는 방식이에요. 명시적 권한과 TCC, 한 번에 한 입력 소유자가 필요하며 격리된 환경은 아니에요.',
    boundary: '사용 권한 필요 · 실제 연결 또는 제어는 시작하지 않아요'
  }
};
function selected() { return document.querySelector('[name=provider]:checked')?.value; }
function renderDetail() { const provider = selected(); $('mode-copy').textContent = details[provider].copy; $('boundary-note').textContent = details[provider].boundary; }
function render(data) {
  document.documentElement.dataset.theme = new URLSearchParams(location.hash.slice(1)).get('theme') === 'dark' ? 'dark' : 'light';
  const provider = data.draft && details[data.draft.provider] ? data.draft.provider : data.computer.provider;
  document.querySelector(`[name=provider][value="${provider}"]`).checked = true;
  renderDetail(); BotPanel.clearError();
}
BotPanel.register(render);
$('computer-form').addEventListener('change', () => { renderDetail(); BotPanel.draft({ provider: selected() }); });
$('computer-form').addEventListener('submit', event => { event.preventDefault(); const provider = selected(); if (!details[provider]) return; BotPanel.clearError(); BotPanel.action('computer.save', { provider }); });
$('back').addEventListener('click', () => BotPanel.action('home'));
$('close').addEventListener('click', () => BotPanel.action('close'));
$('discard').addEventListener('click', () => BotPanel.action('discard'));
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !event.isComposing) { event.preventDefault(); BotPanel.action('close'); } });
BotPanel.preview({ type: 'bot-panel.init', token: 'preview-computer', botId: 'picky', view: 'computer', profile: { name: 'Picky', label: '조율', description: '', notifications: true }, computer: { provider: 'isolated-linux' }, routines: [], routine: null, draft: null });
if (window.parent === window) $('preview-banner').hidden = false;
</script>
</body>
</html>
