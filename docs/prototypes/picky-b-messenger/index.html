function dispatchMessage(target,text,reveal=false) {
  const follow=target===state.view&&(reveal||atBottom());
  const active=['picky','room','mint'].includes(target);
  const stop=/^(?:이\s*(?:작업|요청)\s*)?(?:중단(?:해(?:줘)?|하자)?|그만(?:해(?:줘)?)?|멈춰(?:줘)?|stop)[.!\s]*$/i.test(text);
  if(stop&&active&&state.screen!=='S01') {state.chat[target].push({id:crypto.randomUUID(),text,reply:'진행 중인 작업을 중단했어요.'});state.screen='S07';state.decision=null;clearTimeout(recoveryTimer);}
  else if(state.screen==='S01'&&target==='picky') {state.request=text;state.screen='S02';}
  else {
    state.chat[target].push({id:crypto.randomUUID(),text,reply:stop?'이 대화에 진행 중인 작업은 없어요.':'반영할게요.'});
    if(active&&state.screen==='S03'){state.screen='S04';state.hasChanges=true;}
    else if(active&&['S01','S05','S07'].includes(state.screen)){state.screen='S03';state.hasChanges=true;state.decision=null;}
  }
  render(follow);
}

    case 'schedule-custom':customSchedule();break;
    case 'schedule-quick':case 'schedule-tomorrow':{const captured=scheduleDraft;const dueAt=el.dataset.action==='schedule-tomorrow'?tomorrow().getTime():Date.now()+Number(el.dataset.minutes)*60000;saveSchedule(captured,dueAt);$('schedule-menu').hidePopover();renderComposer();break;}
    case 'edit-schedule':openSchedule(el.dataset.id);break;
    case 'delete-schedule':schedules=schedules.filter(item=>String(item.id)!==el.dataset.id);renderSchedules();break;
    case 'previous':case 'next':changeScene(screens[Math.max(0,Math.min(6,screens.indexOf(state.screen)+(el.dataset.action==='next'?1:-1)))]);break;
    case 'reset':changeScene('S01');break;
    case 'feedback':if(!feedbackContext||!$('feedback-text').value.trim())feedbackContext=contextText();renderFeedback();$('feedback-dialog').showModal();break;
    case 'close-feedback':$('feedback-dialog').close();break;
    case 'save-feedback':{const text=$('feedback-text').value.trim();if(!text)break;feedback.push({context:feedbackContext,text,time:new Date().toISOString()});persistFeedback();$('feedback-text').value='';renderFeedback();break;}
    case 'clear-feedback':if(el.dataset.confirm!=='yes'){el.dataset.confirm='yes';el.textContent='한 번 더 눌러 모두 삭제';break;}feedback=[];persistFeedback();el.dataset.confirm='';el.textContent='의견 모두 지우기';renderFeedback();break;
    case 'download-feedback':downloadFeedback();break;
  }
});
window.addEventListener('hashchange',()=>{closeTransient();const p=new URLSearchParams(location.hash.slice(1));state=scene(allowed(p.get('screen'),screens,'S01'));schedules=[];state.view=allowed(p.get('view'),Object.keys(people),state.view);state.roomJoined=state.view==='room'||p.get('group')==='1';state.panel=allowed(p.get('panel'),['overview','files','checks'],null);theme=allowed(p.get('theme'),['light','dark'],theme);density=allowed(p.get('density'),['comfortable','compact'],density);appSettings.change({theme,density});render(true);beginRecovery();});
setInterval(tickSchedules,1000);

$('settings-icon').innerHTML='<svg viewBox="0 0 24 24"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/><circle cx="12" cy="12" r="3"/></svg>';
$('management-button').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>';
$('send-button').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>';$('search-icon').innerHTML=icon('search');$('inspector-close').innerHTML=icon('close');$('scene-previous').innerHTML=icon('back');$('scene-next').innerHTML=icon('chevron');
render(['S04','S05','S06','S07'].includes(state.screen));beginRecovery();
</script>
