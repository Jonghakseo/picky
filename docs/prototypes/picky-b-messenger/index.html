<script>

let feedbackContext;

function avatar(id) {const p=people[id];return `<div class="avatar ${id}" aria-hidden="true">${p.glyph}</div>`;}

function user(text) {return `<article class="user-message" aria-label="나 메시지"><div><div class="message-meta"><strong>나</strong></div><div class="user-bubble">${esc(text)}</div></div></article>`;}
function currentStatus() {return ({S01:['대기','','clock'],S02:['팀 배정됨','running','people'],S03:['작업 중','running','clock'],S04:['답변 대기','warning','people'],S05:['완료','success','check'],S06:['작업 중','running','clock'],S07:['중단됨','','pause']})[state.screen];}
function personStatus(id) {
  if(state.screen==='S01') return '대기';

function syncHash() {

function notify(text) {clearTimeout(toastTimer);$('notice').textContent=text;$('notice').hidden=false;toastTimer=setTimeout(()=>{$('notice').hidden=true;},3800);}
function renderRoster() {
  const query=$('contact-search').value.trim().toLocaleLowerCase();

function renderMessages() {

}
function beginRecovery() {
  clearTimeout(recoveryTimer);
  if(state.screen!=='S06')return;
  const owner=state;
  recoveryTimer=setTimeout(()=>{if(state!==owner||state.screen!=='S06')return;state.screen='S05';state.decision='share';state.recovered=true;render(true);},5000);
}
function changeScene(id) {
  state=scene(id);schedules=[];scheduleEditor=null;$('schedule-dialog').close();$('contact-search').value='';
  render(['S04','S05','S06','S07'].includes(id));if(['S01','S02','S03'].includes(id))$('message-scroll').scrollTop=0;
  beginRecovery();
}
function navigate(view) {
  if(!people[view]||(view==='room'&&state.screen==='S01'))return;
  state.view=view;if(view==='room'&&state.screen==='S02'){state.screen='S03';state.hasChanges=true;}
  render(true);
}
// This fixed demo recognizes a few stop phrases. Production intent belongs to Pi, not the Swift UI or a keyword parser.
function dispatchMessage(target,text) {
  const active=['picky','room','mint'].includes(target);
  const stop=/^(?:이\s*(?:작업|요청)\s*)?(?:중단(?:해(?:줘)?|하자)?|그만(?:해(?:줘)?)?|멈춰(?:줘)?|stop)[.!\s]*$/i.test(text);
  if(stop&&active&&state.screen!=='S01') {state.chat[target].push({text,reply:'진행 중인 작업을 중단했어요.'});state.screen='S07';state.decision=null;clearTimeout(recoveryTimer);}
  else if(state.screen==='S01'&&target==='picky') {state.request=text;state.screen='S02';}
  else {
    state.chat[target].push({text,reply:stop?'이 대화에 진행 중인 작업은 없어요.':'반영할게요.'});
    if(active&&state.screen==='S03'){state.screen='S04';state.hasChanges=true;}
    else if(active&&['S01','S05','S07'].includes(state.screen)){state.screen='S03';state.hasChanges=true;state.decision=null;}
  }
  render(true);
}
function submit() {
  const text=$('message-input').value.trim();if(!text)return;
  const target=state.view;state.drafts[target]='';dispatchMessage(target,text);$('message-input').focus({preventScroll:true});
}
function openSchedule(id) {
  const existing=id?schedules.find(item=>String(item.id)===String(id)):null;
  const text=existing?existing.text:$('message-input').value.trim();if(!text)return;
  scheduleEditor={token:String(Date.now())+'-'+Math.random(),id:existing?.id||null,target:existing?.target||state.view,text,dueAt:existing?.dueAt||null,owner:state};
  $('schedule-frame').hidden=true;
  $('schedule-frame').src='schedule-message.html#theme='+theme;
  $('schedule-dialog').showModal();
}
function tickSchedules() {
  const due=schedules.filter(item=>item.dueAt<=Date.now());if(!due.length)return;
  schedules=schedules.filter(item=>item.dueAt>Date.now());
  for(const item of due)dispatchMessage(item.target,item.text);
  renderSchedules();
}

function showPanel(panel) {state.panel=allowed(panel,['overview','files','checks'],'overview');render();$('inspector-title').focus({preventScroll:true});}
function contextText() {return `${state.screen} · ${people[state.view].name} · ${currentStatus()[0]} · ${theme==='light'?'라이트':'다크'} · ${density==='comfortable'?'여유 있게':'촘촘하게'} · 상세 ${state.panel||'닫힘'}`;}
function persistFeedback() {try{localStorage.setItem(feedbackKey,JSON.stringify(feedback));feedbackStorage=true;}catch{feedbackStorage=false;}}
function renderFeedback() {
  $('feedback-context').textContent=feedbackContext;
  $('feedback-storage').textContent=feedbackStorage?'이 브라우저에 보관 · 외부 전송 없음':'브라우저 저장 불가 · 창을 닫기 전에 내려받아 주세요';
  $('saved-count').textContent=feedback.length+'개';
  $('feedback-count').textContent=feedback.length?String(feedback.length):'';
  $('feedback-list').innerHTML=feedback.length?feedback.map(n=>`<article class="feedback-note"><small>${esc(n.context)}</small><p>${esc(n.text)}</p></article>`).join(''):'<p class="muted small">아직 담아 둔 의견이 없습니다.</p>';
  $('feedback-download').disabled=!feedback.length;$('feedback-clear').disabled=!feedback.length;
  $('feedback-save').disabled=!$('feedback-text').value.trim();
}
function downloadFeedback() {
  if(!feedback.length) return;
  const text='# Picky B.02 목업 피드백\n\n제품 동작 검증이 아닌 화면·상태·흐름에 대한 의견입니다.\n\n'+feedback.map((n,i)=>`## 의견 ${i+1}\n\n- 화면: ${n.context}\n- 기록 시각: ${n.time}\n\n${n.text}\n`).join('\n');
  const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='picky-b02-feedback.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('composer').addEventListener('submit',event=>{event.preventDefault();submit();});
$('message-input').addEventListener('input',()=>{state.drafts[state.view]=$('message-input').value;const empty=!$('message-input').value.trim();$('send-button').disabled=empty;$('schedule-button').disabled=empty;});
$('message-input').addEventListener('keydown',event=>{if(event.key!=='Enter'||event.isComposing||event.keyCode===229||event.shiftKey)return;event.preventDefault();submit();});
$('contact-search').addEventListener('input',renderRoster);
$('theme-select').addEventListener('change',event=>{theme=event.target.value;render();});
$('density-select').addEventListener('change',event=>{density=event.target.value;render();});
$('scene-select').addEventListener('change',event=>changeScene(event.target.value));
$('feedback-text').addEventListener('input',()=>{$('feedback-save').disabled=!$('feedback-text').value.trim();});
$('feedback-dialog').addEventListener('close',()=>{$('feedback-clear').dataset.confirm='';$('feedback-clear').textContent='의견 모두 지우기';});
$('schedule-dialog').addEventListener('close',()=>{scheduleEditor=null;$('schedule-button').focus({preventScroll:true});});
$('schedule-frame').addEventListener('load',()=>{if(!scheduleEditor)return;$('schedule-frame').contentWindow.postMessage({type:'schedule.init',token:scheduleEditor.token,target:people[scheduleEditor.target].name,text:scheduleEditor.text,dueAt:scheduleEditor.dueAt},location.protocol==='file:'?'*':location.origin);});
window.addEventListener('message',event=>{
  if(event.source!==$('schedule-frame').contentWindow||(location.protocol!=='file:'&&event.origin!==location.origin)||!scheduleEditor)return;
  const data=event.data;
  if(!data||data.token!==scheduleEditor.token||scheduleEditor.owner!==state)return;
  if(data.type==='schedule.ready'){$('schedule-frame').hidden=false;return;}
  if(data.type==='schedule.cancel'){$('schedule-dialog').close();return;}
  if(data.type!=='schedule.submit'||!Number.isFinite(data.dueAt)||data.dueAt<=Date.now())return;
  const entry={id:scheduleEditor.id||nextScheduleId++,target:scheduleEditor.target,text:scheduleEditor.text,dueAt:data.dueAt};
  if(scheduleEditor.id){if(!schedules.some(item=>item.id===scheduleEditor.id)){$('schedule-dialog').close();return;}schedules=schedules.map(item=>item.id===entry.id?entry:item);}
  else{schedules.push(entry);if(state.drafts[entry.target]===entry.text)state.drafts[entry.target]='';}
  $('schedule-dialog').close();renderComposer();
});
$('inspector').addEventListener('keydown',event=>{if(event.key==='Escape'){state.panel=null;render();$('detail-button').focus();}if(!['ArrowLeft','ArrowRight'].includes(event.key)||event.target.getAttribute('role')!=='tab')return;event.preventDefault();const tabs=['overview','files','checks'];state.panel=tabs[(tabs.indexOf(state.panel)+(event.key==='ArrowRight'?1:2))%3];renderInspector();syncHash();$('tab-'+state.panel).focus();});
document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
  switch(el.dataset.action){
    case 'navigate':navigate(el.dataset.view);break;
    case 'group':navigate('room');break;
    case 'details':showPanel('overview');break;
    case 'panel':showPanel(el.dataset.panel);break;
    case 'close-details':state.panel=null;render();$('detail-button').focus();break;
    case 'answer':if(state.screen!=='S04')break;state.decision=el.dataset.answer;state.screen='S05';render(true);break;
    case 'schedule':openSchedule();break;
    case 'edit-schedule':openSchedule(el.dataset.id);break;
    case 'delete-schedule':schedules=schedules.filter(item=>String(item.id)!==el.dataset.id);renderSchedules();break;
    case 'previous':case 'next':changeScene(screens[Math.max(0,Math.min(6,screens.indexOf(state.screen)+(el.dataset.action==='next'?1:-1)))]);break;
    case 'reset':changeScene('S01');break;
    case 'feedback':if(!feedbackContext||!$('feedback-text').value.trim())feedbackContext=contextText();renderFeedback();$('feedback-dialog').showModal();break;
    case 'close-feedback':$('feedback-dialog').close();break;
    case 'save-feedback':{const text=$('feedback-text').value.trim();if(!text)break;feedback.push({context:feedbackContext,text,time:new Date().toISOString()});persistFeedback();$('feedback-text').value='';renderFeedback();break;}
    case 'clear-feedback':if(el.dataset.confirm!=='yes'){el.dataset.confirm='yes';el.textContent='한 번 더 눌러 모두 삭제';break;}feedback=[];persistFeedback();el.dataset.confirm='';el.textContent='의견 모두 지우기';renderFeedback();break;
    case 'download-feedback':downloadFeedback();break;
  }
});
window.addEventListener('hashchange',()=>{const p=new URLSearchParams(location.hash.slice(1));state=scene(allowed(p.get('screen'),screens,'S01'));schedules=[];state.view=allowed(p.get('view'),Object.keys(people),state.view);if(state.screen==='S01'&&state.view==='room')state.view='picky';state.panel=allowed(p.get('panel'),['overview','files','checks'],null);theme=allowed(p.get('theme'),['light','dark'],theme);density=allowed(p.get('density'),['comfortable','compact'],density);render(true);beginRecovery();});
setInterval(tickSchedules,1000);

$('search-icon').innerHTML=icon('search');$('inspector-close').innerHTML=icon('close');$('scene-previous').innerHTML=icon('back');$('scene-next').innerHTML=icon('chevron');
render(['S04','S05','S06','S07'].includes(state.screen));beginRecovery();
</script>
</body>
</html>
