<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="bot-panel.css">
<title>루틴 히스토리</title>
</head>
<body>
<main class="panel" aria-labelledby="panel-title">
  <header class="panel-header">
    <button id="back" class="back-button" type="button" aria-label="관리로 돌아가기">‹ 관리로 돌아가기</button>
    <div class="title-block"><h1 id="panel-title" data-panel-heading tabindex="-1">루틴 히스토리</h1></div>
    <button id="close" class="icon-button" type="button" aria-label="피클 관리 닫기" title="피클 관리 닫기">×</button>
  </header>
  <div class="panel-body">
    <section class="panel-section" aria-labelledby="routine-name">
      <div class="section-heading"><h2 id="routine-name"></h2><button id="edit" type="button">루틴 편집</button></div>
      <p id="history-owner" class="subtle"></p>
      <p class="field-note">모의 실행 기록만 표시합니다. 실제 Pi·도구는 실행하지 않아요.</p>
    </section>
    <p id="empty-state" class="empty-state" hidden>아직 실행 기록이 없어요. 루틴 편집의 테스트 실행으로 모의 기록을 만들 수 있어요.</p>
    <div id="history-list" class="history-list" aria-label="실행 기록 목록"></div>
    <p id="panel-error" class="error" role="alert" aria-live="polite"></p>
  </div>
  <div id="preview-banner" class="preview-banner" hidden>B.06 목업 · 예시 기록 · 실제 실행 없음 · <a href="index.html">메신저로 돌아가기</a></div>
</main>
<script src="bot-panel-bridge.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const date = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const days = ['일', '월', '화', '수', '목', '금', '토'];
function text(tag, value, className = '') { const node = document.createElement(tag); node.textContent = value; node.className = className; return node; }
function triggerText(trigger) {
  if (trigger.kind === 'event') return `PR 병합 · ${trigger.repository}`;
  return `${trigger.kind === 'weekly' ? `매주 ${days[trigger.weekday]}요일` : '매일'} ${trigger.time} · ${trigger.timezone}`;
}
function detailRow(list, label, value) { list.append(text('dt', label), text('dd', value)); }
function render(data) {
  document.documentElement.dataset.theme = new URLSearchParams(location.hash.slice(1)).get('theme') === 'dark' ? 'dark' : 'light';
  const routine = data.routine;
  if (!routine) { $('panel-error').textContent = '루틴을 찾을 수 없어요. 관리에서 다시 선택해 주세요.'; $('edit').disabled = true; return; }
  $('routine-name').textContent = routine.name;
  $('history-owner').textContent = `${data.profile.name} · 최근 ${routine.history.length}개 · Asia/Seoul`;
  $('empty-state').hidden = routine.history.length > 0;
  const list = $('history-list'); list.replaceChildren();
  // Reverse insertion order breaks equal-time ties without changing the stored receipts.
  const records = [...routine.history].reverse().sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  for (const run of records) {
    const row = document.createElement('details'); row.className = 'run-entry';
    const summary = document.createElement('summary');
    const timestamp = text('time', date.format(new Date(run.at))); timestamp.dateTime = run.at;
    const heading = document.createElement('span'); heading.append(timestamp, text('span', '수동 테스트 · 모의 기록', 'subtle'));
    summary.append(heading, text('span', '⌄', 'run-chevron')); summary.lastChild.setAttribute('aria-hidden', 'true');
    const content = document.createElement('div'); content.className = 'run-content';
    content.append(text('h3', '기록 내용'), text('p', run.summary));
    const facts = document.createElement('dl'); facts.className = 'run-facts';
    detailRow(facts, '상태', '모의 확인 · 실제 실행 없음');
    detailRow(facts, '실행 ID', run.id);
    content.append(facts);
    if (run.definition) {
      content.append(text('h3', '실행 당시 루틴'), text('p', run.definition.name));
      content.append(text('h3', '실행 당시 지침'), text('p', run.definition.prompt, 'run-prompt'));
      content.append(text('h3', '저장된 실행 시기'));
      const triggers = document.createElement('ul');
      for (const trigger of run.definition.triggers) triggers.append(text('li', triggerText(trigger)));
      content.append(triggers);
    } else {
      content.append(text('p', '이전 목업 기록에는 당시 지침·실행 시기가 저장되어 있지 않아요.', 'subtle'));
    }
    row.append(summary, content); list.append(row);
  }
}
BotPanel.register(render);
$('back').addEventListener('click', () => BotPanel.action('home'));
$('close').addEventListener('click', () => BotPanel.action('close'));
$('edit').addEventListener('click', () => { const routine = BotPanel.context()?.routine; if (routine) BotPanel.action('routine.open', { id: routine.id }); });
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || event.isComposing) return;
  event.preventDefault();
  const expanded = event.target.closest('details[open]') || document.querySelector('details[open]');
  if (expanded) { expanded.open = false; expanded.querySelector('summary').focus(); }
  else BotPanel.action('close');
});
const definition = { name: '예약 화면 확인', prompt: '예약 날짜를 바꾼 뒤 인원 선택이 유지되는지 확인해요. 배포하거나 외부 메시지를 보내지 마.', enabled: true, triggers: [{ kind: 'weekly', weekday: 1, time: '09:00', timezone: 'Asia/Seoul', repository: '' }] };
BotPanel.preview({ type: 'bot-panel.init', token: 'preview-history', botId: 'mint', view: 'history', profile: { name: '민트', label: '구현', description: '', notifications: true }, computer: { provider: 'isolated-linux' }, routines: [], routine: { id: 'weekday-check', ...definition, history: [{ id: 'example-previous', at: '2026-09-12T00:00:00Z', status: 'preview', summary: '화면 검수를 위한 이전 기록 예시입니다. 실제 실행은 없어요.' }, { id: 'example-latest', at: '2026-09-13T00:00:00Z', status: 'preview', summary: '화면 검수를 위한 기록 예시입니다. 실제 실행은 없어요.', definition }] }, draft: null });
if (window.parent === window) { $('preview-banner').hidden = false; $('edit').disabled = true; $('back').disabled = true; $('close').disabled = true; }
</script>
</body>
</html>
